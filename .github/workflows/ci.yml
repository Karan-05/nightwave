name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality-and-neo4j:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/nightwave
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: starter

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: nightwave
      NIGHTWAVE_REQUIRE_NEO4J: "1"
      SYNTH_MODE: deterministic
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy nightwave

      - name: Compile
        run: python -m compileall nightwave tests

      - name: Seed and validate Neo4j
        run: |
          python -c "from nightwave.multiagent.graph_db import get_mode; assert get_mode() == 'neo4j'"
          python -m nightwave.multiagent.seed

      - name: Unit and contract tests
        run: pytest -q

      - name: Deterministic multi-agent eval against Neo4j
        run: python -m nightwave.multiagent.run
